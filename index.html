<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AM Reverse - ANMA</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-indigo-500 selection:text-white">

  <!-- Watermark Background ANMA -->
  <div class="fixed inset-0 pointer-events-none flex items-center justify-center z-0 opacity-[0.03] select-none">
    <h1 class="text-[25vw] font-black tracking-widest text-white">ANMA</h1>
  </div>

  <!-- Header Section -->
  <header class="relative z-10 border-b border-slate-800/80 bg-slate-900/60 backdrop-blur-xl px-6 py-4 flex justify-between items-center shadow-lg">
    <div class="flex items-center space-x-3">
      <div class="bg-gradient-to-tr from-indigo-600 to-violet-500 p-2.5 rounded-xl text-white shadow-lg shadow-indigo-500/20">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <div>
        <span class="font-extrabold text-xl tracking-tight bg-gradient-to-r from-indigo-400 via-purple-300 to-pink-400 bg-clip-text text-transparent">
          AM Reverse
        </span>
        <span class="text-[10px] font-bold tracking-widest uppercase bg-indigo-500/10 text-indigo-400 px-2 py-0.5 rounded-full border border-indigo-500/20 ml-2">
          v1.0.0
        </span>
      </div>
    </div>

    <!-- Status Badge -->
    <div id="status-badge" class="flex items-center space-x-2 text-xs font-medium px-3.5 py-1.5 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 backdrop-blur-md">
      <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
      <span id="status-text">Client Engine Ready</span>
    </div>
  </header>

  <!-- Main Content -->
  <main class="relative z-10 max-w-3xl mx-auto w-full px-4 py-12 flex-1 flex flex-col justify-center">
    
    <div class="text-center mb-10">
      <h2 class="text-3xl sm:text-5xl font-black text-white tracking-tight mb-3">
        Alight Motion <span class="bg-gradient-to-r from-indigo-400 to-violet-400 bg-clip-text text-transparent">Link Service</span>
      </h2>
      <p class="text-slate-400 text-sm sm:text-base max-w-lg mx-auto leading-relaxed">
        Proses, verifikasi, dan kelola tautan preset Alight Motion secara instan dan aman.
      </p>
    </div>

    <!-- Stats Bar -->
    <div class="grid grid-cols-2 gap-4 mb-8">
      <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 text-center backdrop-blur-xl shadow-xl">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Total Permintaan</p>
        <p id="stat-requests" class="text-3xl font-black text-indigo-400">0</p>
      </div>
      <div class="bg-slate-900/40 border border-slate-800/80 rounded-2xl p-5 text-center backdrop-blur-xl shadow-xl">
        <p class="text-xs font-medium text-slate-400 uppercase tracking-wider mb-1">Terverifikasi</p>
        <p id="stat-verifications" class="text-3xl font-black text-emerald-400">0</p>
      </div>
    </div>

    <!-- Card Form -->
    <div class="bg-slate-900/70 border border-slate-800/80 rounded-3xl p-6 sm:p-8 shadow-2xl backdrop-blur-2xl">
      <div class="space-y-5">
        <label class="block text-sm font-semibold text-slate-200">Masukkan Link Alight Motion</label>
        <div class="relative">
          <input 
            type="url" 
            id="link-input"
            placeholder="https://alight.link/xxxx atau https://alightcreative.com/..." 
            class="w-full bg-slate-950/80 border border-slate-800 rounded-2xl px-4 py-4 pl-12 text-slate-100 placeholder-slate-600 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 transition duration-200"
          >
          <div class="absolute left-4 top-4 text-slate-500">
            <i data-lucide="link" class="w-5 h-5"></i>
          </div>
        </div>

        <!-- Action Buttons -->
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 pt-2">
          <button 
            onclick="handleVerifyLink()" 
            class="w-full bg-slate-800/80 hover:bg-slate-700/80 text-slate-200 font-semibold py-3.5 px-4 rounded-xl border border-slate-700/80 flex items-center justify-center space-x-2 transition duration-200 active:scale-[0.98]">
            <i data-lucide="shield-check" class="w-5 h-5 text-indigo-400"></i>
            <span>Verifikasi Link</span>
          </button>
          <button 
            onclick="handleSendLink()" 
            class="w-full bg-gradient-to-r from-indigo-600 to-violet-600 hover:from-indigo-500 hover:to-violet-500 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg shadow-indigo-600/30 flex items-center justify-center space-x-2 transition duration-200 active:scale-[0.98]">
            <i data-lucide="send" class="w-5 h-5"></i>
            <span>Kirim Link</span>
          </button>
        </div>
      </div>

      <!-- Result Alert -->
      <div id="result-box" class="hidden mt-6 p-4 rounded-2xl text-sm border flex items-start space-x-3 transition-all">
        <div id="result-icon" class="mt-0.5"></div>
        <div id="result-message" class="flex-1 break-all leading-relaxed"></div>
      </div>
    </div>

  </main>

  <!-- Footer dengan Watermark ANMA -->
  <footer class="relative z-10 border-t border-slate-800/80 bg-slate-950/90 py-5 text-center text-xs text-slate-500">
    <div class="flex items-center justify-center space-x-2">
      <span>Powered by</span>
      <span class="font-extrabold tracking-widest text-slate-200 border border-slate-700/80 px-2.5 py-1 rounded-lg bg-slate-900 shadow-inner">
        ANMA
      </span>
      <span>&copy; 2026 AM Reverse Service</span>
    </div>
  </footer>

  <script>
    lucide.createIcons();

    // Local Storage Stats Engine untuk GitHub Pages
    function getStats() {
      const stats = localStorage.getItem('am_reverse_stats');
      return stats ? JSON.parse(stats) : { totalRequests: 0, successfulVerifications: 0 };
    }

    function updateStats(type) {
      const stats = getStats();
      if (type === 'request') stats.totalRequests += 1;
      if (type === 'verify') stats.successfulVerifications += 1;
      localStorage.setItem('am_reverse_stats', JSON.stringify(stats));
      loadStats();
    }

    function loadStats() {
      const stats = getStats();
      document.getElementById('stat-requests').innerText = stats.totalRequests;
      document.getElementById('stat-verifications').innerText = stats.successfulVerifications;
    }

    function validateLinkFormat(link) {
      if (!link) return false;
      const pattern = /^(https?:\/\/)?(alight\.link|alightcreative\.com)\/.+/i;
      return pattern.test(link.trim());
    }

    function showResult(success, message) {
      const box = document.getElementById('result-box');
      const icon = document.getElementById('result-icon');
      const msg = document.getElementById('result-message');

      box.classList.remove('hidden', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
      
      if (success) {
        box.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
        icon.innerHTML = `<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400"></i>`;
      } else {
        box.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
        icon.innerHTML = `<i data-lucide="alert-circle" class="w-5 h-5 text-rose-400"></i>`;
      }

      msg.innerText = message;
      lucide.createIcons();
    }

    function handleSendLink() {
      const input = document.getElementById('link-input');
      const link = input.value;

      if (!validateLinkFormat(link)) {
        showResult(false, 'Format tautan Alight Motion tidak valid! Gunakan format alight.link atau alightcreative.com');
        return;
      }

      updateStats('request');
      showResult(true, 'Tautan Alight Motion berhasil diproses dan dikirim!');
    }

    function handleVerifyLink() {
      const input = document.getElementById('link-input');
      const link = input.value;

      if (!validateLinkFormat(link)) {
        showResult(false, 'Tautan tidak valid untuk diverifikasi! Pastikan tautan berasal dari Alight Motion.');
        return;
      }

      updateStats('verify');
      showResult(true, 'Tautan terverifikasi valid dan siap digunakan!');
    }

    loadStats();
  </script>
</body>
</html>
